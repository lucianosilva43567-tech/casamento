<style>
:root{--gold:#b08d57;--gold-2:#c9a96e;--gold-dark:#8a6a3b;--ivory:#fbf8f2;--paper:#fff;--ink:#3a322a;--muted:#8b8073;--line:#ece3d3;--soft:#f5efe4;--ok:#5f8a5b;--warn:#b98530;--bad:#b45a4f;--shadow:0 10px 30px rgba(80,60,30,.08);--r:16px;--serif:'Cormorant Garamond',Georgia,serif;--script:'Great Vibes',cursive;--sans:'Jost','Montserrat',system-ui,sans-serif}

.grid{display:grid;gap:14px}

.info{text-align:center}

label{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px;font-weight:500}

.choice{display:grid;gap:10px;margin-top:14px}

label.check input{width:20px;height:20px;accent-color:var(--gold)}
.opt-btn{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;padding:14px;border:1px solid var(--line);border-radius:12px;background:#fff;margin-bottom:8px;cursor:pointer;font-size:15px;color:var(--ink)}
.opt-btn:hover{border-color:var(--gold-2)}
.note{background:var(--soft);border-radius:12px;padding:12px 14px;font-size:14px}

.b-ok{background:#e7f0e4;color:var(--ok)}.b-warn{background:#f8eedb;color:var(--warn)}.b-bad{background:#f5e3e0;color:var(--bad)}.b-muted{background:var(--soft);color:var(--muted)}

.tl{position:relative;padding-left:28px;max-width:620px;margin:0 auto}
.tl:before{content:'';position:absolute;left:8px;top:8px;bottom:8px;width:1px;background:var(--gold-2)}

.sched b{font-family:var(--serif);font-size:20px;font-weight:500;color:var(--gold-dark);min-width:58px}
details{border-bottom:1px solid var(--line);padding:14px 0}

.msgs{display:grid;gap:12px}

.ticket{text-align:center;border:1px solid var(--gold-2);outline:1px solid var(--gold-2);outline-offset:5px;padding:24px 16px;background:#fff;margin:6px}

.modal.hidden{display:none}
.sheet{background:var(--ivory);width:100%;max-width:560px;max-height:92svh;overflow:auto;border-radius:22px 22px 0 0;padding:14px 18px calc(24px + env(safe-area-inset-bottom));animation:up .25s ease}

.sheet-head{display:flex;justify-content:flex-end;margin:-4px -8px 0}
.x{border:0;background:none;cursor:pointer;color:var(--muted);width:44px;height:44px;display:grid;place-items:center}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,120px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;z-index:80;transition:transform .3s;max-width:calc(100% - 32px);box-shadow:var(--shadow)}

.toast.err{background:var(--bad)}
.admin-head{display:flex;justify-content:space-between;align-items:center;padding-top:24px}

.admin-tabs::-webkit-scrollbar{display:none}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(min-width:640px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px}
.kpi b{font-family:var(--serif);font-size:30px;font-weight:500;display:block;color:var(--gold-dark);line-height:1.1}
.kpi span{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

.bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;display:flex;margin:10px 0}

.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.row{display:flex;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}

.actions{display:flex;gap:6px;flex-wrap:wrap}
.iconbtn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;cursor:pointer;color:var(--ink);flex:none;text-decoration:none}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.toolbar input{flex:1 1 200px}
.panel-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:18px 0 6px}

.settings fieldset{border:1px solid var(--line);border-radius:var(--r);padding:6px 16px 18px;margin:0 0 16px;background:#fff}
.settings legend{font-family:var(--serif);font-size:21px;padding:0 6px}

.photo-field{display:flex;gap:12px;align-items:center}
.photo-field img,.photo-field .ph-empty{width:84px;height:84px;border-radius:12px;object-fit:cover;background:var(--soft);display:grid;place-items:center;color:var(--gold-2);flex:none}

.center{text-align:center}.muted{color:var(--muted)}.mt{margin-top:16px}.hidden{display:none!important}
.empty{text-align:center;color:var(--muted);padding:34px 10px}
.spin{width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;display:inline-block;animation:sp .7s linear infinite}

:root{--champ:#efe4cf;--ink:#2f2a24}

@keyframes foil{from{background-position:100% 0}to{background-position:0 0}}
.names2 em{font-family:var(--serif);font-style:italic;font-size:.36em;color:var(--gold);line-height:1.3}
.dateline{display:flex;align-items:center;justify-content:center;gap:12px;font-family:var(--serif);font-size:14px;text-transform:uppercase;letter-spacing:.2em;margin:6px 0 4px;color:var(--ink)}
.dateline b{font-weight:500;font-size:24px;letter-spacing:.06em;padding:2px 14px;border-left:1px solid var(--gold-2);border-right:1px solid var(--gold-2);font-variant-numeric:lining-nums}
.countdown{gap:0;margin:22px auto 24px}
.countdown div{border:0!important;border-radius:0;background:none!important;min-width:66px;padding:0 6px;position:relative}
.countdown div+div:before{content:'';position:absolute;left:0;top:16%;bottom:16%;width:1px;background:var(--gold-2)}
.countdown b{font-size:38px;color:var(--ink);font-variant-numeric:tabular-nums}
.countdown small{color:var(--muted)}
.br{position:absolute;width:150px;height:200px;color:var(--gold-2);opacity:.75;pointer-events:none;z-index:0}
.br-tl{top:-14px;left:-30px}
.br-br{bottom:-14px;right:-30px;transform:rotate(180deg)}
@media(min-width:820px){.br{width:240px;height:320px}}
.br path{stroke-dasharray:420;stroke-dashoffset:420;animation:draw 2.4s ease forwards .2s}
.br .leaf{opacity:0;animation:leafin .7s ease forwards;animation-delay:calc(var(--d) + 400ms)}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes leafin{to{opacity:1}}
.sig{font-family:var(--script);font-size:36px;color:var(--gold-dark);margin:14px 0 0}
/* save the date */
.std{display:grid;gap:18px}
@media(min-width:760px){.std{grid-template-columns:330px 1fr;align-items:center;gap:36px}}
.cal{padding:22px 18px}
.cal h3{margin:0 0 14px;text-align:center;font-size:27px}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;font-variant-numeric:tabular-nums;font-size:14px}
.cal-g span{aspect-ratio:1;display:grid;place-items:center;color:var(--ink)}
.cal-g .w{aspect-ratio:auto;font-size:10px;letter-spacing:.12em;color:var(--muted);padding-bottom:6px}
.cal-g i{font-style:normal}
.cal-g .on i{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--gold);color:#fff;box-shadow:0 0 0 3px var(--paper),0 0 0 4px var(--gold-2);font-weight:500}
.std-info{display:flex;flex-direction:column;min-width:0}
.info-row{display:flex;gap:14px;align-items:flex-start;padding:16px 2px;border-bottom:1px solid var(--line)}
.info-row:first-child{border-top:1px solid var(--line)}
.info-row .i{color:var(--gold);margin-top:3px}
.info-row p{margin:0}
.info-row .eyebrow{margin-bottom:2px}
.std-info .btn{align-self:flex-start;margin-top:18px}
/* programação */
.day{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));row-gap:26px}
.day li{position:relative;padding:30px 10px 0;text-align:center}
.day li:before{content:'';position:absolute;top:9px;left:0;right:0;height:1px;background:var(--gold-2)}
.day li:after{content:'';position:absolute;top:3px;left:50%;width:13px;height:13px;margin-left:-7px;border-radius:50%;background:var(--ivory);border:1.5px solid var(--gold)}
.day b{display:block;font-family:var(--serif);font-size:30px;font-weight:500;color:var(--gold-dark);line-height:1.1}
.day span{font-size:13px;color:var(--muted)}
/* história (prévia) */
.story-t{display:grid;gap:30px;align-items:center;justify-items:center;text-align:center;padding-block:24px 50px}
.story-t p{max-width:46ch;margin:0 auto 18px}
@media(min-width:760px){.story-t{grid-template-columns:auto 1fr;text-align:left;justify-items:start;gap:48px}.story-t p{margin-left:0}}
/* hashtag */
.tagband{text-align:center;padding-block:48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));margin-top:30px;background:var(--ink);color:#f3e6c8;position:relative;overflow:hidden}
.tagband .eyebrow{color:var(--gold-2)}
.tagband .tag{font-family:var(--serif);font-style:italic;font-size:clamp(30px,8vw,52px);margin:4px 0 6px;color:#fff;overflow-wrap:anywhere}
.tagband .s{color:#cbbda4}
.tagband .divider{color:var(--gold)}
.tag-inline{font-family:var(--serif);font-style:italic;font-size:24px;color:var(--gold-dark);margin:-10px 0 20px}
footer{margin-top:0}
/* presentes */
.gift{transition:transform .25s,box-shadow .25s}
.gift:hover{transform:translateY(-3px);box-shadow:0 20px 40px -20px rgba(80,60,30,.4)}
.gift .img{background-image:linear-gradient(160deg,#fbf6ec,#ebdcc0);position:relative}
.gift .img .cat{position:absolute;top:10px;left:10px;background:rgba(255,255,255,.88);padding:3px 10px;border-radius:99px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-dark);font-weight:500}
.gift .img .i{color:var(--gold)}
/* guia */
.swatches{display:flex;gap:12px;flex-wrap:wrap;margin-top:6px}
.swatches span{width:54px;height:54px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06),0 6px 14px -6px rgba(0,0,0,.25)}
/* QR de exemplo */
.qr-wrap{position:relative;width:max-content;margin:0 auto}
.qr-wrap .wm{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.qr-wrap .wm b{background:rgba(255,255,255,.92);color:var(--bad);border:1px solid currentColor;padding:4px 12px;border-radius:8px;font-size:12px;letter-spacing:.2em;text-transform:uppercase;transform:rotate(-12deg)}
/* confirmação */
.ticket{background:linear-gradient(180deg,#fff,#fbf5ea)}
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:90}
/* convite de abertura */
.intro{position:fixed;inset:0;z-index:100;display:grid;place-items:center;overflow:hidden}
.intro .flap,.intro .pocket{position:absolute;left:0;right:0;transition:transform 1.05s cubic-bezier(.7,0,.2,1)}
.intro .pocket{bottom:0;height:64%;background:linear-gradient(180deg,#efe3cb,#e6d6b8)}
.intro .flap{top:0;height:60%;z-index:2;background:linear-gradient(180deg,#fbf6ec,#f1e6d0);clip-path:polygon(0 0,100% 0,100% 60%,50% 100%,0 60%)}
.intro-c{position:relative;z-index:3;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:8vh;padding:0 16px;transition:opacity .5s,transform .7s}
.intro-c .eyebrow{margin:0}
.seal{width:108px;height:108px;border-radius:50%;border:0;cursor:pointer;background:radial-gradient(circle at 35% 30%,#dcbf86,#a9834c 55%,#7a5b2f);box-shadow:0 12px 26px rgba(90,60,20,.35),inset 0 0 0 7px rgba(255,255,255,.12),inset 0 0 0 9px rgba(0,0,0,.08);color:#fff8e6;font-family:var(--script);font-size:38px;display:grid;place-items:center;animation:pulse 2.4s ease-in-out infinite}
.seal:focus-visible{outline:2px solid var(--gold-dark);outline-offset:5px}
@keyframes pulse{50%{transform:scale(1.05)}}
.intro .to{font-family:var(--serif);font-style:italic;font-size:26px;margin:0;color:var(--ink)}
.intro .s{margin:0}
.intro.open .flap{transform:translateY(-105%)}
.intro.open .pocket{transform:translateY(105%)}
.intro.open .intro-c{opacity:0;transform:scale(1.25)}
/* barra de atalhos (celular) */
.tabbar{display:none}
.toast{transform:translate(-50%,220px)}
@media(max-width:759px){
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:35;background:rgba(255,253,249,.95);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:4px max(6px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
  .tabbar a,.tabbar button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:500 10px var(--sans);letter-spacing:.04em;color:var(--muted);text-decoration:none;background:none;border:0;min-height:52px;cursor:pointer;padding:0}
  .tabbar .on{color:var(--gold-dark)}
  .tabbar .on .i{stroke-width:2}
  body:not([data-route=admin]) footer{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
  body:not([data-route=admin]) .toast{bottom:calc(86px + env(safe-area-inset-bottom,0px))}
  body[data-route=admin] .tabbar{display:none}
}
.tagband .btn{margin-top:20px}
.tcard{width:100%;max-width:300px;display:block;margin:14px auto;border-radius:6px;box-shadow:0 14px 34px -14px rgba(80,60,30,.45);background:var(--soft);aspect-ratio:2/3}
.album-note{max-width:520px;margin:-6px auto 22px;text-align:center}
@media (prefers-reduced-motion:reduce){.br path{stroke-dashoffset:0}.br .leaf{opacity:1}.names2 span{background-position:0 0}}

function confetti(){

  const x = c.getContext('2d'); x.scale(dpr, dpr);

  const ps = Array.from({length: 140}, () => ({x: W / 2 + (Math.random() - .5) * 60, y: H * .42, vx: (Math.random() - .5) * 13, vy: -Math.random() * 13 - 4, r: Math.random() * 360, vr: (Math.random() - .5) * 14, w: 5 + Math.random() * 7, h: 3 + Math.random() * 4, c: cols[Math.random() * cols.length | 0]}));

/* ============================== PIX ================================== */
function emv(id, val){ const v = String(val); return id + String(v.length).padStart(2, '0') + v; }
function crc16(str){ let crc = 0xFFFF; for (let i = 0; i < str.length; i++) { crc ^= str.charCodeAt(i) << 8; for (let j = 0; j < 8; j++) { crc = (crc & 0x8000) ? ((crc << 1) ^ 0x1021) : (crc << 1); crc &= 0xFFFF; } } return crc.toString(16).toUpperCase().padStart(4, '0'); }
function pixPayload({key, name, city, amount}){
  const clean = s => norm(s).toUpperCase().replace(/[^A-Z0-9 ]/g, '').trim();
  const gui = emv('00', 'br.gov.bcb.pix') + emv('01', String(key).trim());
  let p = emv('00', '01') + emv('26', gui) + emv('52', '0000') + emv('53', '986') +
    (amount > 0 ? emv('54', Number(amount).toFixed(2)) : '') + emv('58', 'BR') +
    emv('59', clean(name).slice(0, 25) || 'NOIVOS') + emv('60', clean(city).slice(0, 15) || 'BRASIL') + emv('62', emv('05', '***'));
  p += '6304'; return p + crc16(p);
}
function pixKey(cfg = S){
  const k = String(cfg.pix.key || '').trim(), t = cfg.pix.keyType;
  if (t === 'celular') { let d = k.replace(/\D/g, ''); if (!(d.startsWith('55') && d.length > 11)) d = '55' + d; return '+' + d; }
  if (t === 'cpf') return k.replace(/\D/g, '');
  if (t === 'email' || t === 'aleatoria') return k.toLowerCase();
  return k;
}
function pixBlock(amount, cfg = S){
  if (!cfg.pix.key) return '<p class="note mt">A chave Pix ainda não foi cadastrada pelos noivos.</p>';
  const code = pixPayload({...cfg.pix, key: pixKey(cfg), amount});
  return `<div class="pix"><div class="qr-wrap"><div class="qr" data-qr="${esc(code)}"></div>${PREVIEW ? '<span class="wm"><b>Exemplo</b></span>' : ''}</div>
    <p class="s center">${amount > 0 ? 'Valor: <b>' + brl(amount) + '</b> · ' : ''}Favorecido: ${esc(cfg.pix.name)}</p>
    <label>Pix copia e cola</label><div class="copy">${esc(code)}</div>
    <div class="grid g2 mt"><button type="button" class="btn sm" data-action="copy" data-text="${esc(code)}">${ic('copy', 16)} Copiar código</button><button type="button" class="btn sm ghost" data-action="copy" data-text="${esc(pixKey(cfg))}">Copiar chave</button></div></div>`;
}
function hydrateQR(root = document){
  $$('[data-qr]', root).forEach(el => {
    if (el.dataset.done) return; el.dataset.done = '1'; el.innerHTML = '';
    if (window.QRCode) new QRCode(el, {text: el.dataset.qr, width: 200, height: 200, correctLevel: QRCode.CorrectLevel.M});
    else el.innerHTML = '<p class="s">QR Code indisponível — use o copia e cola.</p>';
  });
}

}

function startCountdown(el){
  const tick = () => {
    const ms = weddingDate() - Date.now();
    if (ms <= 0) {
      if (!el.dataset.done) { el.dataset.done = '1'; Object.assign(el.style, {flexDirection: 'column', alignItems: 'center', gap: '12px'});
        el.innerHTML = ms > -864e5 ? '<p class="hero-date">Chegou o grande dia!</p>' : '<p class="hero-date">Obrigado por celebrar com a gente!</p><a class="btn" href="#/album">Ver o álbum</a>'; }
      return;
    }
    const v = [[Math.floor(ms / 864e5), 'dias'], [Math.floor(ms / 36e5) % 24, 'horas'], [Math.floor(ms / 6e4) % 60, 'min'], [Math.floor(ms / 1e3) % 60, 'seg']];
    el.innerHTML = v.map(([n, l]) => `<div><b>${String(n).padStart(2, '0')}</b><small>${l}</small></div>`).join('');
  };
  tick(); timers.push(setInterval(tick, 1000));
}

/* ---- confirmação de presença ---- */
function rsvpStep1(){
  const box = $('#rsvp');
  if (!S.rsvpOpen) { box.innerHTML = `<p class="center">As confirmações de presença estão encerradas. ${contactLink()}</p>`; return; }
  box.innerHTML = `<label for="q">Digite seu nome como está no convite</label><input id="q" autocomplete="name" placeholder="Ex.: Maria Silva"><div id="matches" class="mt"></div>`;
  const q = $('#q'), out = $('#matches');
  q.addEventListener('input', debounce(async () => {
    const v = q.value.trim();
    if (v.length < 3) { out.innerHTML = v ? '<p class="s">Digite pelo menos 3 letras.</p>' : ''; return; }
    out.innerHTML = '<p class="s"><span class="spin"></span> Procurando…</p>';
    try {
      rsvpList = await DB.findGuests(v);
      out.innerHTML = rsvpList.length
        ? '<p class="s">Toque no seu nome:</p>' + rsvpList.map(g => `<button class="opt-btn" data-action="pick-guest" data-id="${g.id}"><span>${esc(g.name)}</span>${g.status !== 'pendente' ? `<span class="badge ${g.status === 'confirmado' ? 'b-ok' : 'b-bad'}">${g.status === 'confirmado' ? 'Confirmado' : 'Não vai'}</span>` : ''}</button>`).join('')
        : `<p class="note">Não encontramos esse nome. Tente só o primeiro nome ou o sobrenome. ${contactLink('Ainda não achou? Fale com os noivos.')}</p>`;
    } catch (e) { out.innerHTML = `<p class="note">${esc(e.message)}</p>`; }
  }, 400));
  q.focus();
}
function rsvpStep2(g){
  const max = g.max_people || 1, prev = g.status;
  $('#rsvp').innerHTML = `<div class="fade"><p class="eyebrow">Olá,</p><h3>${esc(g.name)}</h3>
    ${prev !== 'pendente' ? `<p class="note">Você já respondeu: <b>${prev === 'confirmado' ? `presença confirmada (${plural(g.people, 'pessoa', 'pessoas')})` : 'não poderá comparecer'}</b>. Se quiser, altere abaixo.</p>` : ''}
    <p class="s">Seu convite é válido para ${plural(max, 'pessoa', 'pessoas')}.</p>
    <form data-form="rsvp" data-id="${g.id}">
      <div class="choice">
        <label class="opt"><input type="radio" name="status" value="confirmado" required ${prev !== 'recusado' ? 'checked' : ''}> Sim, estarei presente!</label>
        <label class="opt"><input type="radio" name="status" value="recusado" ${prev === 'recusado' ? 'checked' : ''}> Infelizmente não poderei ir</label>
      </div>
      <div id="yes" class="${prev === 'recusado' ? 'hidden' : ''}">
        ${max > 1 ? `<label>Quantas pessoas irão (incluindo você)?</label><select name="people">${range(1, max).map(n => `<option value="${n}" ${n === (g.people || max) ? 'selected' : ''}>${n}</option>`).join('')}</select>
        <label>Dessas, quantas são crianças até 10 anos?</label><select name="children">${range(0, max - 1).map(n => `<option value="${n}" ${n === (g.children || 0) ? 'selected' : ''}>${n === 0 ? 'Nenhuma' : n}</option>`).join('')}</select>
        <label>Nomes dos acompanhantes</label><textarea name="companions" placeholder="Um nome por linha"></textarea>` : '<input type="hidden" name="people" value="1">'}
        <label>Alguma restrição alimentar? (opcional)</label><input name="diet" maxlength="200" placeholder="Ex.: vegetariano, sem glúten, alergia a camarão">
        <label>Seu WhatsApp (opcional)</label><input name="phone" inputmode="tel" autocomplete="tel" placeholder="(31) 99999-9999">
      </div>
      <label>Mensagem para os noivos (opcional)</label><textarea name="message" maxlength="500"></textarea>
      <button class="btn gold block mt">Enviar resposta</button>
      <button type="button" class="btn ghost block mt" data-action="rsvp-back">Não sou eu</button>
    </form></div>`;
  $$('#rsvp input[name=status]').forEach(r => r.addEventListener('change', () => $('#yes').classList.toggle('hidden', r.value === 'recusado' && r.checked)));
}
function rsvpDone(r){
  const box = $('#rsvp');

function fieldHTML(k, label, type = 'text', val){
  const v = val !== undefined ? val : (getPath(draft, k) ?? '');
  if (type.startsWith('select:')) return `<label>${label}</label><select data-k="${k}">${type.slice(7).split('|').map(o => { const [ov, ol] = o.split('='); return `<option value="${ov}" ${v === ov ? 'selected' : ''}>${ol}</option>`; }).join('')}</select>`;
  if (type === 'textarea') return `<label>${label}</label><textarea data-k="${k}">${esc(v)}</textarea>`;
  if (type === 'bool') return `<label class="check"><input type="checkbox" data-k="${k}" data-type="bool" ${v ? 'checked' : ''}> ${label}</label>`;
  if (type === 'colorlist') return `<label>${label}</label><input data-k="${k}" data-type="colorlist" value="${esc((Array.isArray(v) ? v : []).join(', '))}">`;
  if (type === 'numlist') return `<label>${label}</label><input data-k="${k}" data-type="numlist" inputmode="decimal" value="${esc((Array.isArray(v) ? v : []).join(', '))}">`;
  if (type === 'photo') return `<label>${label}</label><div class="photo-field">${v ? `<img src="${esc(v)}" alt="">` : `<div class="ph-empty">${ic('image', 28)}</div>`}<div class="actions"><button type="button" class="btn sm" data-action="set-photo" data-k="${k}">${v ? 'Trocar' : 'Enviar'} foto</button>${v ? `<button type="button" class="btn sm danger" data-action="clear-photo" data-k="${k}">Remover</button>` : ''}</div></div>`;
  return `<label>${label}</label><input type="${type}" data-k="${k}" value="${esc(v)}">`;
}
function listEditor(path, fields, addLabel){
  const arr = getPath(draft, path) || [];
  const tpl = esc(JSON.stringify(Object.fromEntries(fields.map(f => [f.k, '']))));
  return `<div>${arr.map((it, i) => `<div class="list-item"><button type="button" class="x" data-action="li-del" data-path="${path}" data-i="${i}" aria-label="Remover">${ic('x', 16)}</button>${fields.map(f => fieldHTML(`${path}.${i}.${f.k}`, f.label, f.type, it[f.k] ?? '')).join('')}</div>`).join('')}
    <button type="button" class="btn sm ghost mt" data-action="li-add" data-path="${path}" data-tpl="${tpl}">${ic('plus', 14)} ${addLabel}</button></div>`;
}

async function exportExcel(){
  if (PREVIEW) return toast('No site publicado, este botão baixa a planilha do Excel.');
  await loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
  const wb = XLSX.utils.book_new();
  const add = (name, rows) => {
    const ws = XLSX.utils.json_to_sheet(rows.length ? rows : [{'(vazio)': ''}]);
    const keys = Object.keys(rows[0] || {'(vazio)': ''});
    ws['!cols'] = keys.map(k => ({wch: Math.min(50, Math.max(k.length, ...rows.map(r => String(r[k] ?? '').length)) + 2)}));
    XLSX.utils.book_append_sheet(wb, ws, name);
  };
  const gname = id => A.gifts.find(g => g.id === id)?.title || '';
  add('Convidados', A.guests.map(g => ({Nome: g.name, Grupo: g.group_name || '', WhatsApp: g.phone || '', 'Pessoas autorizadas': g.max_people, Situação: STATUS[g.status][1], 'Pessoas confirmadas': g.people || 0, Crianças: g.children || 0, 'Restrição alimentar': g.diet || '', Acompanhantes: (g.companions || '').replace(/\n/g, ', '), Mensagem: g.message || '', 'Respondido em': g.responded_at ? new Date(g.responded_at).toLocaleString('pt-BR') : '', Código: g.code || ''})));
  add('Presentes', A.gifts.map(g => ({Presente: g.title, Tipo: CAT[g.category], Valor: Number(g.price), Situação: g.unique_reserve ? (g.reserved_by ? 'Escolhido' : 'Disponível') : 'Cota', 'Escolhido por': g.reserved_by || '', Mensagem: g.reserved_message || '', 'Vezes presenteado': g.times_given || 0})));
  add('Pix', A.contrib.map(c => ({Nome: c.name, Valor: Number(c.amount), Presente: gname(c.gift_id), Situação: c.status === 'confirmado' ? 'Confirmado' : 'A conferir', Mensagem: c.message || '', Data: new Date(c.created_at).toLocaleString('pt-BR')})));
  add('Recados', A.msgs.map(m => ({Nome: m.name, Recado: m.text, Visível: m.approved ? 'Sim' : 'Não', Data: new Date(m.created_at).toLocaleString('pt-BR')})));
  XLSX.writeFile(wb, `casamento-${new Date().toISOString().slice(0, 10)}.xlsx`);
}

    setTimeout(() => el.remove(), 1100);
  },
  menu(){ $('#menu').classList.toggle('open'); },
  close: closeModal,
  'pick-guest'(el){ const g = rsvpList.find(x => x.id === el.dataset.id); if (g) rsvpStep2(g); },
  'rsvp-back'(){ if (location.hash.split('/').length > 2) location.hash = '#/rsvp'; else rsvpStep1(); },
  ics: downloadIcs,
  gf(el){ giftFilter = el.dataset.v; drawGifts(); },
  gift(el){

    await busy(el, async () => { const c = await tableCardCanvas(); await new Promise(r => c.toBlob(b => { downloadBlob(b, 'cartao-mesa-album.png'); r(); }, 'image/png')); });
  },
  amt(el){ $('#amt').value = Number(el.dataset.v).toFixed(2).replace('.', ','); updatePixBox(); },
  view(el){ openModal(el.dataset.type === 'video' ? `<video src="${esc(el.dataset.src)}" controls autoplay playsinline></video>` : `<img src="${esc(el.dataset.src)}" alt="">`, 'dark'); },
  async logout(){ await DB.logout(); location.hash = '#/'; },
  atab(el){ adminTab = el.dataset.t; if (adminTab === 'config') draft = null; drawAdmin(); window.scrollTo(0, 0); },
  gfilt(el){ gFilter = el.dataset.v; drawGuestChips(); drawGuestList(); },
  'guest-link'(el){ const g = A.guests.find(x => x.id === el.dataset.id); if (g?.code) copyText(siteLink('rsvp/' + g.code)); },
  'guest-new'(){ guestModal(); },
  'guest-edit'(el){ guestModal(A.guests.find(g => g.id === el.dataset.id)); },
  async 'guest-del'(el){ if (!confirm('Excluir este convidado?')) return; await busy(el, async () => { await DB.deleteGuest(el.dataset.id); closeModal(); toast('Convidado excluído'); await reloadAdmin(); }); },
  import(){
    openModal(`<h3>Importar lista</h3><p class="s">Um convidado por linha, no formato: <b>Nome; pessoas; WhatsApp; grupo</b>. Só o nome é obrigatório.</p>
      <form data-form="import"><textarea name="list" style="min-height:200px" placeholder="Maria Silva; 2; 31999999999; Família da noiva&#10;João Santos; 1&#10;Família Souza; 4"></textarea><button class="btn gold block mt">Importar</button></form>`);
  },
  reminders: remindersModal,
  wa(el){
    const g = A.guests.find(x => x.id === el.dataset.id); if (!g) return;
    const n = waNumber(g.phone); if (!n) return toast('Convidado sem WhatsApp', 'err');
    window.open(`https://wa.me/${n}?text=${encodeURIComponent(fillTpl(waTpl, g))}`, '_blank');
  },
  async export(el){ await busy(el, exportExcel); },
  'gift-new'(){ giftModal(); },
  'gift-edit'(el){ giftModal(A.gifts.find(g => g.id === el.dataset.id)); },
  async 'gift-unreserve'(el){ if (!confirm('Liberar a reserva deste presente? Ele volta a ficar disponível.')) return; await busy(el, async () => { await DB.unreserveGift(el.dataset.id); toast('Reserva liberada'); await reloadAdmin(); }); },
  async 'gift-del'(el){ if (!confirm('Excluir este presente?')) return; await busy(el, async () => { await DB.deleteGift(el.dataset.id); closeModal(); toast('Presente excluído'); await reloadAdmin(); }); },
  async 'upload-img'(el){
    const file = await pickFile('image/*'); if (!file) return;
    await busy(el, async () => { const url = await DB.uploadSiteImage(file); $('#sheet [name=image_url]').value = url; const p = $('#gimgprev'); p.firstElementChild.outerHTML = `<img src="${esc(url)}" alt="">`; });
  },
  'contrib-new': contribModal,
  async 'contrib-toggle'(el){ const c = A.contrib.find(x => x.id === el.dataset.id); await busy(el, async () => { await DB.saveContribution({id: c.id, status: c.status === 'confirmado' ? 'informado' : 'confirmado'}); await reloadAdmin(); }); },
  async 'contrib-del'(el){ if (!confirm('Excluir esta contribuição?')) return; await busy(el, async () => { await DB.deleteContribution(el.dataset.id); await reloadAdmin(); }); },
  async 'msg-toggle'(el){ const m = A.msgs.find(x => x.id === el.dataset.id); await busy(el, async () => { await DB.updateMessage(m.id, {approved: !m.approved}); await reloadAdmin(); }); },
  async 'msg-del'(el){ if (!confirm('Excluir este recado?')) return; await busy(el, async () => { await DB.deleteMessage(el.dataset.id); await reloadAdmin(); }); },
  async 'photo-del'(el){ const p = A.photos.find(x => x.id === el.dataset.id); if (!p || !confirm('Excluir este arquivo do álbum?')) return; await busy(el, async () => { await DB.deletePhoto(p); await reloadAdmin(); }); },
  async 'toggle-album'(el){
    const val = el.checked;
    await busy(null, async () => { S.albumOpen = val; await DB.saveSettings(S); draft = null; toast(val ? 'Álbum aberto para os convidados' : 'Álbum fechado'); });
  },
  async 'set-photo'(el){
    const file = await pickFile('image/*'); if (!file) return;
    await busy(el, async () => { const url = await DB.uploadSiteImage(file); setPath(draft, el.dataset.k, url); drawAdmin(); toast('Foto carregada — lembre de salvar'); });
  },
  'clear-photo'(el){ setPath(draft, el.dataset.k, ''); drawAdmin(); },
  'li-add'(el){ const arr = getPath(draft, el.dataset.path) || []; arr.push(JSON.parse(el.dataset.tpl)); setPath(draft, el.dataset.path, arr); drawAdmin(); },
  'li-del'(el){ const arr = getPath(draft, el.dataset.path) || []; arr.splice(Number(el.dataset.i), 1); drawAdmin(); },
  async 'save-settings'(el){
    if (!draft.name1 || !draft.name2 || !draft.date) return toast('Preencha os nomes e a data', 'err');
    await busy(el, async () => { await DB.saveSettings(draft); S = deepMerge(structuredClone(DEFAULTS), structuredClone(draft)); applyBrand(); $$('#menu a').forEach(a => a.classList.toggle('active', a.dataset.r === 'admin')); toast('Configurações salvas!'); });
  }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]'); if (!el) return;
  const fn = ACTIONS[el.dataset.action]; if (!fn) return;
  if (el.type !== 'checkbox') e.preventDefault();
  fn(el, e);
});

/* ======================== FORMULÁRIOS (envio) ======================== */
const FORMS = {
  async rsvp(f, d){
    const status = d.status, people = status === 'confirmado' ? Number(d.people || 1) : 0;
    const children = status === 'confirmado' ? Math.min(Number(d.children || 0), people) : 0;
    await busy(f, async () => { const r = await DB.submitRsvp(f.dataset.id, {status, people, children, diet: d.diet, companions: d.companions, message: d.message, phone: d.phone}); rsvpDone({...r, status, people, children}); });
  },
  async gift(f, d){
    const g = GIFTS.find(x => x.id === f.dataset.id);
    await busy(f, async () => {
      await DB.reserveGift(g.id, d.name.trim(), d.message);
      giftPending = {gift: g, name: d.name.trim(), message: d.message};
      $('#sheet').innerHTML = `<div class="sheet-head"><button class="x" data-action="close">${ic('x')}</button></div><div class="fade"><p class="eyebrow">${g.unique_reserve ? 'Presente reservado' : 'Obrigado!'}</p><h3>${esc(g.title)}</h3>
        <p class="s">${g.unique_reserve ? 'Pronto, ele está reservado no seu nome.' : ''} Agora é só fazer o Pix de <b>${brl(g.price)}</b>${g.link ? ' ou comprar na loja' : ''}.</p>
        ${pixBlock(g.price)}${S.pix.key ? `<button class="btn gold block mt" data-action="pix-done">Já fiz o Pix — avisar os noivos</button>` : ''}
        ${g.link ? `<a class="btn ghost block mt" href="${esc(g.link)}" target="_blank" rel="noopener">Comprar na loja</a>` : ''}</div>`;
      hydrateQR($('#sheet'));
      GIFTS = await DB.listGifts(); if ($('#gl')) drawGifts();
    });
  },
  async pix(f, d){
    const amount = parseMoney(d.amount); if (amount <= 0) return toast('Informe o valor do Pix', 'err');
    await busy(f, async () => {
      await DB.addContribution({name: d.name.trim(), amount, message: d.message});
      $('#pixcard').innerHTML = `<div class="center fade"><div class="ornament">${ic('heart')}</div><h3>Muito obrigado!</h3><p>Avisamos os noivos da sua contribuição de <b>${brl(amount)}</b>. Seu carinho significa muito.</p><a class="btn" href="#/mural">Deixar um recado no mural</a></div>`;
    });
  },
  async msg(f, d){
    await busy(f, async () => { const r = await DB.addMessage(d.name, d.text); f.reset(); toast(r && r.approved === false ? 'Recado enviado! Ele aparece após aprovação.' : 'Recado enviado!'); drawMessages(); });
  },
  async photos(f){
    const files = [...f.files.files]; if (!files.length) return;
    const name = f.name.value.trim(), msg = $('#upmsg');
    await busy(f, async () => {
      let ok = 0;
      for (const [i, file] of files.entries()) {
        msg.textContent = `Enviando ${i + 1} de ${files.length}…`;
        try { await DB.uploadPhoto(file, name); ok++; } catch (e) { toast(e.message, 'err'); }
      }
      msg.textContent = `${plural(ok, 'arquivo enviado', 'arquivos enviados')}. Obrigado!`;
      f.files.value = ''; drawAlbum();
    });
  },
  async login(f, d){ await busy(f, async () => { await DB.login(d.email.trim(), d.password); render(); }); },
  async guest(f, d){
    const max = Math.max(1, parseInt(d.max_people) || 1);
    const old = A.guests.find(g => g.id === f.dataset.id);
    let people = parseInt(d.people) || 0;
    if (d.status === 'confirmado') people = Math.min(max, Math.max(1, people || max)); else people = 0;
    const g = {name: d.name.trim(), group_name: d.group_name.trim(), phone: d.phone.trim(), max_people: max, status: d.status, people, children: d.status === 'confirmado' ? Math.min(people, Math.max(0, parseInt(d.children) || 0)) : 0, diet: (d.diet || '').trim() || null, companions: d.companions, message: d.message,
      responded_at: d.status === 'pendente' ? null : (old?.responded_at || nowISO())};
    if (f.dataset.id) g.id = f.dataset.id;
    await busy(f, async () => { await DB.saveGuest(g); closeModal(); toast('Convidado salvo'); await reloadAdmin(); });
  },
  async import(f, d){
    const list = d.list.split('\n').map(l => l.trim()).filter(Boolean).map(l => {
      const [name, max, phone, group] = l.split(/[;\t]/).map(s => (s || '').trim());
      return {name, max_people: Math.max(1, parseInt(max) || 1), phone: phone || null, group_name: group || null, status: 'pendente', people: 0};
    }).filter(g => g.name);
    if (!list.length) return toast('Nenhum nome encontrado', 'err');
    await busy(f, async () => { await DB.saveGuests(list); closeModal(); toast(`${plural(list.length, 'convidado importado', 'convidados importados')}`); await reloadAdmin(); });
  },
  async giftEdit(f, d){
    const g = {title: d.title.trim(), description: d.description, category: d.category, price: parseMoney(d.price), image_url: d.image_url || null, link: d.link || null, unique_reserve: !!d.unique_reserve, sort: parseInt(d.sort) || 0};
    if (f.dataset.id) g.id = f.dataset.id;
    await busy(f, async () => { await DB.saveGift(g); closeModal(); toast('Presente salvo'); await reloadAdmin(); });
  },
  async contrib(f, d){
    const amount = parseMoney(d.amount); if (amount <= 0) return toast('Informe o valor', 'err');
    await busy(f, async () => { await DB.saveContribution({name: d.name.trim(), amount, gift_id: d.gift_id || null, message: d.message || null, status: d.confirmed ? 'confirmado' : 'informado'}); closeModal(); toast('Contribuição registrada'); await reloadAdmin(); });
  }
};
document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-form]'); if (!f) return;
  e.preventDefault();
  FORMS[f.dataset.form]?.(f, Object.fromEntries(new FormData(f)));
});

/* ---- edição ao vivo das configurações e campos do painel ---- */
function onField(e){
  const t = e.target;
  if (t.id === 'watpl') { waTpl = t.value; return; }
  if (t.id === 'gsearch') { gSearch = t.value; drawGuestList(); return; }
  if (!t.dataset.k || !t.closest('#settings') || !draft) return;
  let v = t.value;
  if (t.dataset.type === 'bool') v = t.checked;
  else if (t.dataset.type === 'colorlist') v = v.split(/[;,\s]+/).filter(s => /^#[0-9a-f]{3,8}$/i.test(s));
  else if (t.dataset.type === 'numlist') v = v.split(/[;,\s]+/).map(parseMoney).filter(n => n > 0);
  setPath(draft, t.dataset.k, v);
}
document.addEventListener('input', onField);
document.addEventListener('change', onField);

/* ---- sincroniza abas no modo demonstração ---- */
window.addEventListener('storage', e => {
  if (e.key !== LS_KEY || !DEMO) return;
  try { store = JSON.parse(e.newValue) || store; } catch {}
  if (route() === 'admin' && $('#apanel')) reloadAdmin(true);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeModal(); closeMenu(); } });

/* ============================== INÍCIO =============================== */
(async function boot(){
  if (DEMO) document.body.insertAdjacentHTML('afterbegin', '<div class="demo-banner">Modo demonstração — os dados ficam só neste aparelho. Configure o Supabase para publicar.</div>');
  try { S = await DB.getSettings(); } catch (e) { console.error(e); toast('Não foi possível carregar as configurações', 'err'); }
  applyBrand();
  window.addEventListener('hashchange', render);
  await render();
  showIntro();
})();
</script>
